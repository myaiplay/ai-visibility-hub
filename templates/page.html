<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" type="application/rss+xml" title="AI Visibility Index" href="{{base}}/feed.xml">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="AI Visibility Index">
<meta property="og:type" content="website">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{og_image}}">
<style>{{css}}</style>
{{jsonld}}
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="{{base}}/">AI Visibility Index</a>
    <nav>
      <a href="{{base}}/articles/why-chatgpt-doesnt-recommend-your-business/">Guides</a>
      <a href="{{base}}/dashboard/">Dashboard</a>
      <a href="{{base}}/about/">About</a>
      <a class="nav-cta" href="https://aicantfindme.com?utm_source=hub&amp;utm_medium=nav&amp;utm_campaign=hub_cta">Get a report</a>
    </nav>
  </div>
</header>
<main class="wrap">
{{content}}
</main>
<footer>
  <div class="wrap">
    <p>© {{year}} AI Visibility Index — free research by the makers of
    <a href="https://aicantfindme.com?utm_source=hub&amp;utm_medium=footer&amp;utm_campaign=hub_cta">aicantfindme.com</a></p>
    <p class="fine">AI answers vary between runs. Findings here are directional, not guaranteed. Not legal or SEO advice.</p>
  </div>
</footer>
<script data-goatcounter="https://aicantseeme.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
document.addEventListener('click', function(e) {
  var a = e.target.closest && e.target.closest('a[href*="aicantfindme.com"]');
  if (a && window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({
      path: '/outbound/aicantfindme.com',
      title: (a.textContent || 'cta').trim().slice(0, 60),
      event: true
    });
  }
});
</script>
</body>
</html>
