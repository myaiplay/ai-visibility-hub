name: Build site
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python engine/aggregate.py
      - run: python build.py
      - run: python engine/indexnow.py
      - name: Commit built site
        run: |
          git config user.name "traffic-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "build: regenerate site [skip ci]"
          git pull --rebase && git push
