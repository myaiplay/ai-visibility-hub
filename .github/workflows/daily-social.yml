name: Daily social post
on:
  schedule:
    - cron: '43 21 * * *'  # daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pynacl
      - name: Post next queued item (skips if not configured)
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_STATE_KEY: ${{ secrets.X_STATE_KEY }}
        run: python social/post_x.py
      - name: Commit rotated queue + token state
        run: |
          git config user.name "traffic-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "social: daily post [skip ci]"
          git pull --rebase && git push
