name: Nightly data engine
on:
  schedule:
    - cron: '17 3 * * *'  # daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run prompt tests (skips if no key)
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python engine/run_tests.py
      - run: python engine/aggregate.py
      - name: Regenerate dashboard (traffic + status)
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python engine/dashboard.py
      - run: python build.py
      - run: python engine/indexnow.py
      - name: Commit results
        run: |
          git config user.name "traffic-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "data: nightly engine run [skip ci]"
          git pull --rebase && git push
