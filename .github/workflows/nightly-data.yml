name: Nightly data engine
on:
  schedule:
    - cron: '17 3 * * *'  # daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run prompt tests (skips if no key)
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python engine/run_tests.py
      - run: python engine/aggregate.py
      - run: python build.py
      - name: Commit results
        run: |
          git config user.name "traffic-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data docs content/index
          git diff --staged --quiet || git commit -m "data: nightly engine run [skip ci]"
          git push
