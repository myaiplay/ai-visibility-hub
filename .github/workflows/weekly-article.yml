name: Weekly data article
on:
  schedule:
    - cron: '7 6 * * 1'  # Mondays
  workflow_dispatch:
permissions:
  contents: write
jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate article from recorded data (skips if no data/key)
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python engine/generate_article.py
      - run: python engine/aggregate.py
      - run: python engine/dashboard.py
      - run: python build.py
      - run: python engine/indexnow.py
      - name: Syndicate to Dev.to (picks up the new article)
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python engine/syndicate_devto.py
      - name: Commit everything
        run: |
          git config user.name "traffic-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "article: weekly data article [skip ci]"
          git pull --rebase && git push
