# Buyer-intent prompt sets for the data engine.
# The engine asks each engine these prompts and records which businesses get named.
# Add rows to expand coverage. Keep categories buyer-intent ("hire", "best").

categories:
  - plumber
  - electrician
  - dentist
  - landscaper
  - house cleaner
  - personal injury lawyer
  - roofer
  - accountant

cities:
  - Denver, CO
  - Austin, TX
  - Seattle, WA
  - Chicago, IL
  - Phoenix, AZ
  - Melbourne, Australia
  - Sydney, Australia
  - Brisbane, Australia

templates:
  - "best {category} in {city}"
  - "who should I hire for {category} services near {city}?"

# Self-monitoring: track aicantfindme.com's OWN AI visibility over time.
# Eat our own cooking — these results feed the weekly report.
self_prompts:
  - "best tools to check if ChatGPT recommends my business"
  - "how to check AI search visibility for my business"
  - "best AI visibility audit tools"
  - "why doesn't ChatGPT recommend my business"
  - "best GEO tools for local businesses"
  - "how to get my business recommended by Perplexity"
